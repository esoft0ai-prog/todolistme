<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Camplo Super Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .adm-wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
    .adm-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .adm-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
    .adm-tiles .card b { display: block; font: 700 28px var(--f-display); margin-top: 8px; }
    .adm-table { width: 100%; border-collapse: collapse; }
    .adm-table th { text-align: left; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
    .adm-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; vertical-align: middle; }
    .adm-table tr:hover td { background: var(--bg-hover); cursor: pointer; }
    .adm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 900px) { .adm-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .adm-hide-sm { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="overlay"></div>
  <div id="toasts" class="toasts"></div>
  <script src="/icons.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
